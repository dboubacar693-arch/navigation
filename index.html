<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Étape 2 – Les QR codes lancent et arrêtent le trait</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 640px; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  .boutons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  button { min-height: 46px; padding: 8px 14px; font-size: 1rem; border: 1px solid #888; border-radius: 8px; background: #fff; }
  button:disabled { opacity: 0.4; }
  #btnScan { width: 100%; background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; }
  #message { padding: 10px 12px; border-left: 6px solid #2563eb; background: #eef2ff; border-radius: 8px; margin-bottom: 12px; }
  #zoneScan { display: none; margin-bottom: 12px; }
  #video { width: 100%; border-radius: 10px; background: #000; display: block; margin-bottom: 8px; }
  canvas#dessin { width: 100%; height: auto; border: 1px solid #aaa; display: block; }
  #infos { margin: 10px 0; font-size: 0.95rem; line-height: 1.5; }
  details { margin-top: 16px; padding: 10px; background: #f0f0f0; border-radius: 8px; font-size: 0.9rem; }
  details .boutons { margin-top: 10px; }
</style>
</head>
<body>

<h1>Dessiner un trait avec deux QR codes</h1>

<div id="message">Scannez le QR code « début » pour commencer un trait.</div>

<button id="btnScan">📷 Scanner un QR code</button>

<div id="zoneScan">
  <video id="video" playsinline muted></video>
  <button id="btnAnnulerScan">Annuler</button>
</div>

<div class="boutons" style="margin-top:12px">
  <button id="effacerDernier">Effacer le dernier trait</button>
  <button id="toutEffacer">Tout effacer</button>
</div>

<canvas id="dessin" width="600" height="600"></canvas>
<div id="infos"></div>

<!-- Les anciens boutons, gardés pour tester sans QR code -->
<details>
  <summary>Mode test (sans QR code)</summary>
  <div class="boutons">
    <button id="demarrer">▶ Démarrer un trait</button>
    <button id="arreter" disabled>■ Arrêter le trait</button>
    <button id="btnPas">Faire un pas de 3 m</button>
  </div>
</details>

<!-- Bibliothèque qui sait lire un QR code dans une image -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

<script>
// =====================================================
// A. LA MÉMOIRE DU PROGRAMME
// =====================================================
const traits = [];        // les traits terminés
let traitEnCours = null;  // le trait qu'on dessine (null si aucun)
let idSuivi = null;       // numéro de l'écouteur GPS
let derniere = null;      // dernière position connue

const COULEURS = ["#2563eb", "#e11d48", "#16a34a", "#f59e0b", "#7c3aed", "#0891b2"];
const DISTANCE_MIN = 2;   // mètres


// =====================================================
// B. GPS → MÈTRES
// =====================================================
function enMetres(p, ref) {
  const M = 111320;
  return {
    x: (p.lng - ref.lng) * M * Math.cos(ref.lat * Math.PI / 180),
    y: (ref.lat - p.lat) * M
  };
}


// =====================================================
// C. DESSINER
// =====================================================
const canvas = document.getElementById("dessin");
const ctx = canvas.getContext("2d");

function dessiner() {
  const L = canvas.width, H = canvas.height, marge = 30;
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, L, H);

  const lesTraits = traitEnCours ? traits.concat([traitEnCours]) : traits;
  const tous = lesTraits.flat();
  if (derniere) tous.push(derniere);

  if (tous.length === 0) {
    ctx.fillStyle = "#999";
    ctx.font = "18px sans-serif";
    ctx.fillText("Aucun trait pour l’instant", 180, H / 2);
    return;
  }

  const ref = tous[0];
  const m = tous.map(p => enMetres(p, ref));
  const minX = Math.min(...m.map(p => p.x)), maxX = Math.max(...m.map(p => p.x));
  const minY = Math.min(...m.map(p => p.y)), maxY = Math.max(...m.map(p => p.y));
  const largeur = Math.max(maxX - minX, 10);
  const hauteur = Math.max(maxY - minY, 10);

  const echelle = Math.min((L - 2 * marge) / largeur, (H - 2 * marge) / hauteur);
  const decalX = (L - 2 * marge - largeur * echelle) / 2;
  const decalY = (H - 2 * marge - hauteur * echelle) / 2;

  function versEcran(p) {
    const q = enMetres(p, ref);
    return {
      x: marge + decalX + (q.x - minX) * echelle,
      y: marge + decalY + (q.y - minY) * echelle
    };
  }

  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  lesTraits.forEach((trait, i) => {
    const couleur = COULEURS[i % COULEURS.length];
    ctx.strokeStyle = couleur;
    ctx.fillStyle = couleur;
    if (trait.length === 1) {
      const a = versEcran(trait[0]);
      ctx.beginPath(); ctx.arc(a.x, a.y, 5, 0, Math.PI * 2); ctx.fill();
      return;
    }
    ctx.beginPath();
    trait.forEach((p, k) => {
      const a = versEcran(p);
      if (k === 0) ctx.moveTo(a.x, a.y); else ctx.lineTo(a.x, a.y);
    });
    ctx.stroke();
  });

  if (derniere) {
    const a = versEcran(derniere);
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.beginPath(); ctx.arc(a.x, a.y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(a.x, a.y, 7, 0, Math.PI * 2); ctx.fill();
  }

  ctx.fillStyle = "#666";
  ctx.font = "13px sans-serif";
  ctx.fillText("Zone affichée : " + Math.round(largeur) + " m × " + Math.round(hauteur) + " m", 10, H - 8);
}


// =====================================================
// D. MESSAGES ET INFOS
// =====================================================
const messageEl = document.getElementById("message");
const infos = document.getElementById("infos");

function dire(texte) { messageEl.textContent = texte; }

function majInfos() {
  let texte = "";
  if (derniere) {
    texte += "Position : " + derniere.lat.toFixed(6) + ", " + derniere.lng.toFixed(6);
    texte += " (précision ± " + Math.round(derniere.precision) + " m)<br>";
  }
  texte += traitEnCours ? "🔴 Trait en cours : " + traitEnCours.length + " points<br>" : "";
  texte += "Traits conservés : " + traits.length;
  infos.innerHTML = texte;
}


// =====================================================
// E. RECEVOIR LES POSITIONS (GPS)
// =====================================================
function nouvellePosition(lat, lng, precision) {
  derniere = { lat: lat, lng: lng, precision: precision };

  if (traitEnCours) {
    const dernierPoint = traitEnCours[traitEnCours.length - 1];
    let assezLoin = true;
    if (dernierPoint) {
      const d = enMetres(derniere, dernierPoint);
      assezLoin = Math.hypot(d.x, d.y) >= DISTANCE_MIN;
    }
    if (assezLoin) traitEnCours.push({ lat: lat, lng: lng });
  }
  majInfos();
  dessiner();
}

function quandGps(pos) {
  nouvellePosition(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy);
}
function quandErreurGps(err) {
  dire("GPS indisponible : " + err.message + " (autorisez la localisation pour ce site)");
}


// =====================================================
// F. DÉMARRER / ARRÊTER UN TRAIT
// =====================================================
const btnDemarrer = document.getElementById("demarrer");
const btnArreter = document.getElementById("arreter");

function demarrerTrait() {
  if (traitEnCours) {
    dire("Un trait est déjà en cours. Scannez le QR code « fin » pour l’arrêter.");
    return;
  }
  if (!navigator.geolocation) {
    dire("Ce navigateur ne gère pas la géolocalisation.");
    return;
  }
  traitEnCours = [];
  idSuivi = navigator.geolocation.watchPosition(quandGps, quandErreurGps, {
    enableHighAccuracy: true,
    maximumAge: 0,
    timeout: 15000
  });
  btnDemarrer.disabled = true;
  btnArreter.disabled = false;
  dire("Trait en cours… Déplacez-vous, puis scannez le QR code « fin ».");
  majInfos();
  dessiner();
}

function arreterTrait() {
  if (!traitEnCours) {
    dire("Aucun trait en cours. Scannez d’abord le QR code « début ».");
    return;
  }
  if (idSuivi !== null) navigator.geolocation.clearWatch(idSuivi);
  idSuivi = null;
  if (traitEnCours.length > 0) traits.push(traitEnCours);
  traitEnCours = null;
  btnDemarrer.disabled = false;
  btnArreter.disabled = true;
  dire("Trait terminé et conservé. Scannez « début » pour en faire un autre.");
  majInfos();
  dessiner();
}

btnDemarrer.addEventListener("click", demarrerTrait);
btnArreter.addEventListener("click", arreterTrait);


// =====================================================
// G. LE SCANNER DE QR CODE (nouveau)
// =====================================================
const video = document.getElementById("video");
const zoneScan = document.getElementById("zoneScan");
const btnScan = document.getElementById("btnScan");
const canvasScan = document.createElement("canvas");   // canvas invisible pour analyser les images
const ctxScan = canvasScan.getContext("2d", { willReadFrequently: true });

let flux = null;
let scanEnCours = false;

// Ce que contient un QR code → l'action à faire.
// Les deux QR codes contiennent simplement le texte "debut" et le texte "fin".
function lireAction(texte) {
  let valeur = texte.trim().toLowerCase();
  try {
    // au cas où le QR contient une adresse du type ...?action=debut
    const a = new URL(texte).searchParams.get("action");
    if (a) valeur = a.trim().toLowerCase();
  } catch (e) { /* ce n'est pas une adresse, on garde le texte tel quel */ }

  if (valeur === "debut" || valeur === "début") return "debut";
  if (valeur === "fin") return "fin";
  // Dernier recours : "action=debut" ou "action=fin" apparaît dans le texte
  if (/action=d[eé]but/.test(valeur)) return "debut";
  if (/action=fin/.test(valeur)) return "fin";
  return null;
}

async function demarrerScan() {
  if (scanEnCours) return;
  if (typeof jsQR === "undefined") {
    dire("La bibliothèque de lecture des QR codes ne s’est pas chargée. Vérifiez la connexion internet et rechargez la page.");
    return;
  }
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
  } catch (e) {
    dire("Caméra indisponible ou refusée. Autorisez-la dans les réglages du navigateur.");
    return;
  }
  video.srcObject = flux;
  await video.play();
  zoneScan.style.display = "block";
  btnScan.style.display = "none";
  scanEnCours = true;
  dire("Visez un QR code…");
  boucleScan();
}

function arreterScan() {
  scanEnCours = false;
  if (flux) flux.getTracks().forEach(t => t.stop());
  flux = null;
  zoneScan.style.display = "none";
  btnScan.style.display = "block";
}

// Se répète : prend une image de la vidéo et cherche un QR code dedans
function boucleScan() {
  if (!scanEnCours) return;

  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvasScan.width = video.videoWidth;
    canvasScan.height = video.videoHeight;
    ctxScan.drawImage(video, 0, 0);
    const image = ctxScan.getImageData(0, 0, canvasScan.width, canvasScan.height);
    const resultat = jsQR(image.data, image.width, image.height);

    if (resultat) {
      const action = lireAction(resultat.data);
      if (action) {
        arreterScan();                       // on éteint la caméra
        if (action === "debut") demarrerTrait();   // QR n°1
        if (action === "fin") arreterTrait();      // QR n°2
        return;
      }
      dire("QR code lu mais non reconnu. Contenu : « " + resultat.data + " »");
    }
  }
  requestAnimationFrame(boucleScan);
}

btnScan.addEventListener("click", demarrerScan);
document.getElementById("btnAnnulerScan").addEventListener("click", () => {
  arreterScan();
  dire("Scan annulé.");
});


// =====================================================
// H. EFFACER
// =====================================================
document.getElementById("effacerDernier").addEventListener("click", () => {
  traits.pop();
  majInfos();
  dessiner();
});
document.getElementById("toutEffacer").addEventListener("click", () => {
  traits.length = 0;
  majInfos();
  dessiner();
});


// =====================================================
// I. MODE TEST : simuler un déplacement
// =====================================================
let cap = 0;
document.getElementById("btnPas").addEventListener("click", () => {
  if (!traitEnCours) {
    dire("Démarrez d’abord un trait.");
    return;
  }
  const base = derniere || { lat: 48.8566, lng: 2.3522 };
  cap += (Math.random() - 0.5) * 0.9;
  const lat = base.lat + Math.cos(cap) * 3 / 111320;
  const lng = base.lng + Math.sin(cap) * 3 / (111320 * Math.cos(base.lat * Math.PI / 180));
  nouvellePosition(lat, lng, 3);
});

majInfos();
dessiner();
</script>
</body>
</html>
