<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boussole Simple</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: white;
      font-family: sans-serif;
    }

    /* Le cercle de la boussole */
    #boussole {
      width: 250px;
      height: 250px;
      border: 4px solid #444;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* La flèche qui va tourner */
    #fleche {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 100px solid #ff3b30; /* Pointe rouge vers le haut */
      transform-origin: bottom center; /* Pivot au centre du cercle */
      position: absolute;
      top: 25px;
      transition: transform 0.1s ease-out; /* Animation fluide */
    }

    button {
      margin-top: 30px;
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="boussole">
    <div id="fleche"></div>
  </div>
  <p id="angle">Angle : 0°</p>
  <button id="btn-start">Activer la boussole</button>

  <script>
    const fleche = document.getElementById('fleche');
    const texteAngle = document.getElementById('angle');
    const bouton = document.getElementById('btn-start');

    function gererOrientation(event) {
      let cap = null;

      // Pour iOS (Safari)
      if (event.webkitCompassHeading) {
        cap = event.webkitCompassHeading;
      } 
      // Pour Android (Chrome)
      else if (event.alpha !== null) {
        cap = 360 - event.alpha;
      }

      if (cap !== null) {
        // On arrondit l'angle
        const angle = Math.round(cap);
        texteAngle.innerText = `Angle : ${angle}°`;

        // Rotation inverse pour que la flèche pointe toujours vers le Nord
        fleche.style.transform = `rotate(${-angle}deg)`;
      }
    }

    bouton.addEventListener('click', () => {
      // iOS 13+ oblige à demander la permission à l'utilisateur
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', gererOrientation);
              bouton.style.display = 'none';
            }
          })
          .catch(console.error);
      } else {
        // Android et autres navigateurs
        window.addEventListener('deviceorientationabsolute', gererOrientation);
        window.addEventListener('deviceorientation', gererOrientation);
        bouton.style.display = 'none';
      }
    });
  </script>

</body>
</html>
