<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace en intérieur avec QR codes</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 640px; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  .boutons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  button { min-height: 46px; padding: 8px 14px; font-size: 1rem; border: 1px solid #888; border-radius: 8px; background: #fff; }
  #btnScan { width: 100%; background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; margin-bottom: 12px; }
  #message { padding: 10px 12px; border-left: 6px solid #2563eb; background: #eef2ff; border-radius: 8px; margin-bottom: 12px; }
  #zoneScan { display: none; margin-bottom: 12px; }
  #video { width: 100%; border-radius: 10px; background: #000; display: block; margin-bottom: 8px; }
  canvas#dessin { width: 100%; height: auto; border: 1px solid #aaa; display: block; }
  #infos { margin: 10px 0; font-size: 0.95rem; line-height: 1.5; }
  details { margin-top: 16px; padding: 10px; background: #f0f0f0; border-radius: 8px; font-size: 0.9rem; }
  details .boutons { margin-top: 10px; }
</style>
</head>
<body>

<h1>Dessiner un trait avec deux QR codes</h1>

<div id="message">Scannez le QR code « début », puis marchez en tenant le téléphone à plat.</div>

<button id="btnScan">📷 Scanner un QR code</button>

<div id="zoneScan">
  <video id="video" playsinline muted></video>
  <button id="btnAnnulerScan">Annuler</button>
</div>

<div class="boutons">
  <button id="effacerDernier">Effacer le dernier trait</button>
  <button id="toutEffacer">Tout effacer</button>
</div>

<canvas id="dessin" width="600" height="600"></canvas>
<div id="infos"></div>

<!-- Pour tester sans QR code et sans marcher -->
<details>
  <summary>Mode test</summary>
  <div class="boutons">
    <button id="demarrer">▶ Démarrer un trait</button>
    <button id="arreter">■ Arrêter le trait</button>
  </div>
  <div class="boutons">
    <button id="gauche">⟲ Tourner de 30°</button>
    <button id="droite">⟳ Tourner de 30°</button>
    <button id="pasTest">Faire un pas</button>
  </div>
</details>

<script>
// =====================================================
// A. LES RÉGLAGES (à modifier pour ajuster)
// =====================================================
const ZONE = 20;            // largeur affichée, en mètres
const LONGUEUR_PAS = 0.7;   // longueur d'un pas, en mètres
const SEUIL_PAS = 1.5;      // sensibilité des pas (plus petit = plus sensible)
const DELAI_PAS = 350;      // temps minimum entre deux pas (millisecondes)
const COULEURS = ["#2563eb", "#e11d48", "#16a34a", "#f59e0b", "#7c3aed", "#0891b2"];


// =====================================================
// B. LA MÉMOIRE DU PROGRAMME
// =====================================================
const traits = [];                // les traits terminés
let traitEnCours = null;          // le trait qu'on dessine (null si aucun)
let position = { x: 0, y: 0 };    // position en mètres depuis le départ
let cap = 0;                      // direction en degrés (0 = nord, 90 = est)
let nbPas = 0;
let moyenne = 9.8;                // moyenne de l'accélération (≈ gravité)
let dernierPas = 0;               // heure du dernier pas
let auDessus = false;             // l'écart est-il au-dessus du seuil ?
let capteursActifs = false;
let capRecu = false;              // a-t-on reçu des données de boussole ?


// =====================================================
// C. DESSINER
// =====================================================
const canvas = document.getElementById("dessin");
const ctx = canvas.getContext("2d");

// Mètres → pixels. Le point de départ est au centre du canvas.
function versEcran(p) {
  const echelle = canvas.width / ZONE;   // pixels pour 1 mètre
  return {
    x: canvas.width / 2 + p.x * echelle,
    y: canvas.height / 2 + p.y * echelle
  };
}

function dessiner() {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // le point de départ (gris)
  const o = versEcran({ x: 0, y: 0 });
  ctx.fillStyle = "#999";
  ctx.beginPath();
  ctx.arc(o.x, o.y, 6, 0, Math.PI * 2);
  ctx.fill();

  // les traits, chacun dans sa couleur
  const tous = traitEnCours ? traits.concat([traitEnCours]) : traits;
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  tous.forEach((trait, i) => {
    ctx.strokeStyle = COULEURS[i % COULEURS.length];
    ctx.beginPath();
    trait.forEach((p, k) => {
      const a = versEcran(p);
      if (k === 0) ctx.moveTo(a.x, a.y);
      else ctx.lineTo(a.x, a.y);
    });
    ctx.stroke();
  });

  // la position actuelle (rond noir) et la direction (petit trait)
  if (traitEnCours) {
    const a = versEcran(position);
    const rad = cap * Math.PI / 180;
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(a.x, a.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(a.x + Math.sin(rad) * 28, a.y - Math.cos(rad) * 28);
    ctx.stroke();
  }
  majInfos();
}


// =====================================================
// D. MESSAGES ET INFOS
// =====================================================
const messageEl = document.getElementById("message");
const infos = document.getElementById("infos");

function dire(texte) { messageEl.textContent = texte; }

function majInfos() {
  let texte = "";
  if (traitEnCours) {
    texte += "🔴 Trait en cours · Cap : " + Math.round(cap) + "° · Pas : " + nbPas +
             " · Distance : " + (nbPas * LONGUEUR_PAS).toFixed(1) + " m<br>";
  }
  texte += "Traits conservés : " + traits.length;
  infos.innerHTML = texte;
}


// =====================================================
// E. LES CAPTEURS : PAS (accéléromètre) ET DIRECTION (boussole)
// =====================================================

// Faire un pas : on avance de LONGUEUR_PAS mètres dans la direction du cap
function faireUnPas() {
  if (!traitEnCours) return;
  const rad = cap * Math.PI / 180;
  position = {
    x: position.x + Math.sin(rad) * LONGUEUR_PAS,
    y: position.y - Math.cos(rad) * LONGUEUR_PAS   // vers le haut de l'écran = nord
  };
  traitEnCours.push({ x: position.x, y: position.y });
  nbPas++;
  dessiner();
}

// Détecter les pas avec l'accéléromètre
function surMouvement(e) {
  if (!traitEnCours || scanEnCours) return;   // pas de comptage pendant le scan
  const a = e.accelerationIncludingGravity;
  if (!a || a.x === null) return;

  // force totale ressentie : ~9.8 au repos, qui oscille quand on marche
  const force = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
  moyenne = moyenne * 0.98 + force * 0.02;      // moyenne qui suit lentement
  const ecart = force - moyenne;                // l'oscillation due à la marche

  // un pas = l'écart passe au-dessus du seuil, pas trop vite après le précédent
  const maintenant = Date.now();
  if (ecart > SEUIL_PAS && !auDessus && maintenant - dernierPas > DELAI_PAS) {
    dernierPas = maintenant;
    faireUnPas();
  }
  auDessus = ecart > SEUIL_PAS;
}

// Lire la boussole
function surOrientation(e) {
  if (typeof e.webkitCompassHeading === "number") {
    cap = e.webkitCompassHeading;               // iPhone
    capRecu = true;
  } else if (e.alpha !== null) {
    cap = (360 - e.alpha) % 360;                // Android
    capRecu = true;
  }
  if (traitEnCours) dessiner();
}

// Activer les capteurs. Sur iPhone, ça doit se faire juste après un clic.
async function activerCapteurs() {
  if (capteursActifs) return true;
  try {
    if (typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {
      const reponses = await Promise.all([
        DeviceMotionEvent.requestPermission(),
        DeviceOrientationEvent.requestPermission()
      ]);
      if (reponses.some(r => r !== "granted")) return false;
    }
  } catch (e) {
    return false;
  }
  window.addEventListener("devicemotion", surMouvement);
  if ("ondeviceorientationabsolute" in window) {
    window.addEventListener("deviceorientationabsolute", surOrientation);
  } else {
    window.addEventListener("deviceorientation", surOrientation);
  }
  capteursActifs = true;
  return true;
}


// =====================================================
// F. DÉMARRER / ARRÊTER UN TRAIT
// =====================================================

// Ce que fait le QR code « début »
function demarrerTrait() {
  if (traitEnCours) {
    dire("Un trait est déjà en cours. Scannez le QR code « fin » pour l’arrêter.");
    return;
  }
  position = { x: 0, y: 0 };
  nbPas = 0;
  traitEnCours = [{ x: 0, y: 0 }];
  if (!capteursActifs) {
    dire("Trait démarré, mais les capteurs ne sont pas activés. Autorisez-les, ou utilisez le mode test.");
  } else {
    dire("Trait en cours… Marchez en tenant le téléphone à plat, puis scannez le QR code « fin ».");
    setTimeout(() => {
      if (traitEnCours && !capRecu) {
        dire("Aucune donnée de boussole reçue. Autorisez les capteurs de mouvement pour ce site.");
      }
    }, 3000);
  }
  dessiner();
}

// Ce que fait le QR code « fin »
function arreterTrait() {
  if (!traitEnCours) {
    dire("Aucun trait en cours. Scannez d’abord le QR code « début ».");
    return;
  }
  traits.push(traitEnCours);
  dire("Trait terminé (" + nbPas + " pas, environ " + (nbPas * LONGUEUR_PAS).toFixed(1) +
       " m). Scannez « début » pour en faire un autre.");
  traitEnCours = null;
  dessiner();
}


// =====================================================
// G. LE SCANNER DE QR CODE
// =====================================================
const video = document.getElementById("video");
const zoneScan = document.getElementById("zoneScan");
const btnScan = document.getElementById("btnScan");
const canvasScan = document.createElement("canvas");   // canvas invisible pour analyser les images
const ctxScan = canvasScan.getContext("2d", { willReadFrequently: true });

let flux = null;
let scanEnCours = false;

// Le QR code contient une adresse comme ...?action=debut ou ...?action=fin
function lireAction(texte) {
  let valeur = texte.trim().toLowerCase();
  try {
    const a = new URL(texte).searchParams.get("action");
    if (a) valeur = a.trim().toLowerCase();
  } catch (e) { /* ce n'est pas une adresse, on garde le texte */ }

  if (valeur === "debut" || valeur === "début") return "debut";
  if (valeur === "fin") return "fin";
  if (/action=d[eé]but/.test(valeur)) return "debut";
  if (/action=fin/.test(valeur)) return "fin";
  return null;
}

// Charger jsQR : d'abord un fichier local (jsQR.js), puis deux sites de secours
const SOURCES_JSQR = [
  "jsQR.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js",
  "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
];

function chargerScript(url) {
  return new Promise(resolve => {
    const s = document.createElement("script");
    s.src = url;
    s.onload = () => resolve(typeof jsQR !== "undefined");
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

async function chargerJsQR() {
  if (typeof jsQR !== "undefined") return true;
  for (const url of SOURCES_JSQR) {
    if (await chargerScript(url)) return true;
  }
  return false;
}

// Détecteur de QR codes intégré au navigateur, s'il existe (rapide et précis)
let detecteurNatif = null;
if ("BarcodeDetector" in window) {
  try { detecteurNatif = new BarcodeDetector({ formats: ["qr_code"] }); }
  catch (e) { detecteurNatif = null; }
}

let nbImages = 0;
let texteScan = "";
let minuteurAide = null;

async function demarrerScan() {
  if (scanEnCours) return;
  dire("Préparation du scanner…");
  const jsqrOk = await chargerJsQR();
  if (!jsqrOk && !detecteurNatif) {
    dire("Impossible de charger la bibliothèque de lecture des QR codes. Ajoutez le fichier jsQR.js à côté de la page, ou essayez avec les données mobiles.");
    return;
  }
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });
  } catch (e) {
    dire("Caméra indisponible ou refusée. Autorisez-la dans les réglages du navigateur.");
    return;
  }
  video.srcObject = flux;
  await video.play();
  zoneScan.style.display = "block";
  btnScan.style.display = "none";
  scanEnCours = true;
  nbImages = 0;
  texteScan = "Recherche d’un QR code…";
  dire(texteScan);

  minuteurAide = setTimeout(() => {
    if (scanEnCours) {
      texteScan = "Toujours rien. Approchez le QR code (15 à 25 cm), tenez-le bien droit, bien éclairé, sans reflet.";
      dire(texteScan + " (" + nbImages + " images analysées)");
    }
  }, 8000);

  boucleScan();
}

function arreterScan() {
  scanEnCours = false;
  clearTimeout(minuteurAide);
  if (flux) flux.getTracks().forEach(t => t.stop());
  flux = null;
  zoneScan.style.display = "none";
  btnScan.style.display = "block";
}

// Analyse l'image actuelle de la vidéo : renvoie le texte du QR code, ou null
async function lireImage() {
  if (detecteurNatif) {
    try {
      const r = await detecteurNatif.detect(video);
      if (r.length > 0) return r[0].rawValue;
    } catch (e) { /* on essaie avec jsQR */ }
  }
  if (typeof jsQR !== "undefined") {
    canvasScan.width = video.videoWidth;
    canvasScan.height = video.videoHeight;
    ctxScan.drawImage(video, 0, 0);
    const image = ctxScan.getImageData(0, 0, canvasScan.width, canvasScan.height);
    const resultat = jsQR(image.data, image.width, image.height, { inversionAttempts: "attemptBoth" });
    if (resultat) return resultat.data;
  }
  return null;
}

// Se répète tant qu'on scanne
async function boucleScan() {
  if (!scanEnCours) return;

  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    const texte = await lireImage();
    if (!scanEnCours) return;
    nbImages++;

    if (texte) {
      const action = lireAction(texte);
      if (action) {
        arreterScan();                           // on éteint la caméra
        if (action === "debut") demarrerTrait(); // QR n°1
        if (action === "fin") arreterTrait();    // QR n°2
        return;
      }
      texteScan = "QR code lu mais non reconnu. Contenu : « " + texte + " »";
      dire(texteScan);
    } else if (nbImages % 10 === 0) {
      dire(texteScan + " (" + nbImages + " images analysées)");
    }
  }
  requestAnimationFrame(boucleScan);
}

// Le clic sur "Scanner" : on active d'abord les capteurs (obligatoire sur iPhone), puis la caméra
btnScan.addEventListener("click", async () => {
  await activerCapteurs();
  demarrerScan();
});

document.getElementById("btnAnnulerScan").addEventListener("click", () => {
  arreterScan();
  dire("Scan annulé.");
});


// =====================================================
// H. EFFACER
// =====================================================
document.getElementById("effacerDernier").addEventListener("click", () => {
  traits.pop();
  dessiner();
});
document.getElementById("toutEffacer").addEventListener("click", () => {
  traits.length = 0;
  dessiner();
});


// =====================================================
// I. MODE TEST (sans QR code et sans marcher)
// =====================================================
document.getElementById("demarrer").addEventListener("click", demarrerTrait);
document.getElementById("arreter").addEventListener("click", arreterTrait);
document.getElementById("gauche").addEventListener("click", () => {
  cap = (cap - 30 + 360) % 360;
  dessiner();
});
document.getElementById("droite").addEventListener("click", () => {
  cap = (cap + 30) % 360;
  dessiner();
});
document.getElementById("pasTest").addEventListener("click", faireUnPas);

dessiner();
</script>
</body>
</html>
