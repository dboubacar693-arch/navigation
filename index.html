<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation dans le bâtiment</title>
<style>
  :root {
    --bg: #f4f5f7;
    --carte: #ffffff;
    --texte: #1a1a1a;
    --doux: #6b7280;
    --bordure: #d9dce1;
    --accent: #2563eb;
    --ok: #16a34a;
    --erreur: #e11d48;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --carte: #1b1e25;
      --texte: #f1f2f4;
      --doux: #9aa1ad;
      --bordure: #2c303a;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--texte);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.4;
    padding: 16px 16px 40px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 4px 0 16px; }
  h2 { font-size: 1.05rem; margin: 0; }

  /* Les cartes (une par étape) */
  .carte {
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .carte.inactive { opacity: 0.45; }
  .entete { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .num {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.95rem; flex-shrink: 0;
  }

  /* Liste déroulante et boutons : grands, faciles à toucher */
  select {
    width: 100%;
    min-height: 48px;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--bordure);
    border-radius: 10px;
    background: var(--bg);
    color: var(--texte);
  }
  button {
    min-height: 48px;
    padding: 10px 16px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 10px;
    border: 1px solid var(--bordure);
    background: var(--bg);
    color: var(--texte);
    cursor: pointer;
  }
  button.primaire {
    width: 100%;
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.secondaire { width: 100%; margin-top: 8px; }

  /* Bandeau de message */
  #message {
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 12px;
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-left: 6px solid var(--accent);
  }
  #message[data-type="ok"]     { border-left-color: var(--ok); }
  #message[data-type="erreur"] { border-left-color: var(--erreur); }

  /* Zone de scan */
  #zoneScan { display: none; margin-top: 10px; }
  #video { width: 100%; border-radius: 12px; background: #000; display: block; }
  #destinationTexte { margin: 0 0 10px; color: var(--doux); }

  /* Le plan */
  canvas#plan {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 10px;
    background: #fff;
  }

  details { margin-top: 20px; color: var(--doux); font-size: 0.9rem; }
  details select { margin-top: 8px; }
</style>
</head>
<body>
<main>

<h1 id="titre">Navigation</h1>

<!-- Messages pour l'utilisateur -->
<div id="message" data-type="info"></div>

<!-- ÉTAPE 1 -->
<section class="carte" id="etape1">
  <div class="entete"><span class="num">1</span><h2>Où êtes-vous ?</h2></div>
  <select id="choixPosition"></select>
</section>

<!-- ÉTAPE 2 -->
<section class="carte inactive" id="etape2">
  <div class="entete"><span class="num">2</span><h2>Où allez-vous ?</h2></div>
  <p id="destinationTexte"></p>
  <button class="primaire" id="btnScan">Scanner le QR code</button>
  <div id="zoneScan">
    <video id="video" playsinline muted></video>
    <button class="secondaire" id="btnAnnulerScan">Annuler</button>
  </div>
</section>

<!-- LE PLAN -->
<section class="carte">
  <canvas id="plan" width="600" height="400"></canvas>
</section>

<details>
  <summary>Mode test (ordinateur, sans QR code)</summary>
  <select id="choixTest"></select>
</details>

</main>

<!-- Bibliothèque de lecture de QR code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

<script>
// =====================================================================
// ⚙️  CONFIG : LA SEULE PARTIE À MODIFIER POUR CHANGER DE PLAN
// =====================================================================
const CONFIG = {

  // Le titre affiché en haut de la page
  titre: "Navigation – École",

  // L'image du plan, dans le même dossier que ce fichier.
  //   null          → on utilise le plan d'exemple dessiné par le code
  //   "plan.png"    → on utilise ton image
  // Les coordonnées x et y ci-dessous sont en pixels de CETTE image.
  image: null,

  // Les points : salles ET intersections de couloir.
  // Pour trouver x et y : ajoute ?debug dans l'adresse et clique sur le plan.
  points: {
    entree:    { nom: "Entrée",      x: 313, y: 380 },
    couloir:   { nom: "Couloir",     x: 307, y: 212 },
    couloirAD: { nom: "Couloir A-D", x: 155, y: 188 },
    couloirCE: { nom: "Couloir C-E", x: 453, y: 209 },
    salleA:    { nom: "Salle A",     x: 124, y: 144 },
    salleB:    { nom: "Salle B",     x: 322, y: 133 },
    salleC:    { nom: "Salle C",     x: 499, y: 132 },
    salleD:    { nom: "Salle D",     x: 120, y: 250 },
    salleE:    { nom: "Salle E",     x: 490, y: 250 }
  },

  // Les liens : "on peut aller directement de ce point à celui-là".
  // Ils empêchent la ligne de traverser les murs.
  liens: [
    ["entree", "couloir"],
    ["couloir", "couloirAD"],
    ["couloir", "couloirCE"],
    ["couloir", "salleB"],
    ["couloirAD", "salleA"],
    ["couloirAD", "salleD"],
    ["couloirCE", "salleC"],
    ["couloirCE", "salleE"]
  ],

  // Les lieux proposés comme position de départ et comme destination
  // (les intersections n'en font pas partie).
  lieux: ["entree", "salleA", "salleB", "salleC", "salleD", "salleE"]
};
// =====================================================================
// FIN DE LA CONFIG : en dessous, rien à changer pour un nouveau plan
// =====================================================================


const points = CONFIG.points;
const params = new URLSearchParams(window.location.search);
const debug = params.has("debug");

document.getElementById("titre").textContent = CONFIG.titre;
document.title = CONFIG.titre;


// ---------------------------------------------------------------------
// A. Trouver le chemin
// ---------------------------------------------------------------------
const voisins = {};
for (const id in points) voisins[id] = [];
for (const [a, b] of CONFIG.liens) {
  if (!points[a] || !points[b]) {
    console.warn("Lien ignoré, point inconnu :", a, b);
    continue;
  }
  voisins[a].push(b);
  voisins[b].push(a);
}

function trouverChemin(depart, arrivee) {
  const venantDe = {};
  venantDe[depart] = null;
  const file = [depart];

  while (file.length > 0) {
    const courant = file.shift();
    if (courant === arrivee) break;
    for (const v of voisins[courant]) {
      if (!(v in venantDe)) {
        venantDe[v] = courant;
        file.push(v);
      }
    }
  }

  if (!(arrivee in venantDe)) return null;

  const chemin = [];
  let id = arrivee;
  while (id !== null) {
    chemin.unshift(id);
    id = venantDe[id];
  }
  return chemin;
}


// ---------------------------------------------------------------------
// B. Dessiner
// ---------------------------------------------------------------------
const canvas = document.getElementById("plan");
const ctx = canvas.getContext("2d");
const imagePlan = new Image();

// Un plan plus grand a besoin de traits et de textes plus grands :
// "u" s'adapte à la taille du canvas (1 pour le plan d'exemple).
function u() { return canvas.width / 600; }

function dessinerPlanExemple() {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, 600, 400);
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 3;
  ctx.strokeRect(20, 20, 560, 360);
  ctx.strokeRect(20, 20, 200, 140);
  ctx.strokeRect(220, 20, 180, 140);
  ctx.strokeRect(400, 20, 180, 140);
  ctx.strokeRect(20, 240, 200, 140);
  ctx.strokeRect(400, 240, 180, 140);
  ctx.fillStyle = "#999";
  ctx.font = "16px sans-serif";
  ctx.fillText("Salle A", 90, 95);
  ctx.fillText("Salle B", 280, 95);
  ctx.fillText("Salle C", 470, 95);
  ctx.fillText("Salle D", 90, 315);
  ctx.fillText("Salle E", 470, 315);
}

function dessinerPlan() {
  if (CONFIG.image) {
    ctx.drawImage(imagePlan, 0, 0);
  } else {
    dessinerPlanExemple();
  }
}

function dessinerLigne(chemin) {
  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 6 * u();
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(points[chemin[0]].x, points[chemin[0]].y);
  for (let i = 1; i < chemin.length; i++) {
    ctx.lineTo(points[chemin[i]].x, points[chemin[i]].y);
  }
  ctx.stroke();
}

// Un rond de couleur avec un halo, et un texte lisible (contour blanc)
function dessinerPastille(id, couleur, texte) {
  const p = points[id];
  const k = u();

  ctx.fillStyle = couleur + "40";   // couleur transparente pour le halo
  ctx.beginPath();
  ctx.arc(p.x, p.y, 17 * k, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = couleur;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 9 * k, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 2 * k;
  ctx.stroke();

  ctx.font = "bold " + (15 * k) + "px sans-serif";
  ctx.lineWidth = 4 * k;
  ctx.strokeStyle = "#fff";
  ctx.strokeText(texte, p.x + 16 * k, p.y - 14 * k);
  ctx.fillStyle = couleur;
  ctx.fillText(texte, p.x + 16 * k, p.y - 14 * k);
}

// Mode debug : montre tous les points et liens
function dessinerGrapheDebug() {
  const k = u();
  ctx.strokeStyle = "rgba(37, 99, 235, 0.5)";
  ctx.lineWidth = 2 * k;
  for (const [a, b] of CONFIG.liens) {
    if (!points[a] || !points[b]) continue;
    ctx.beginPath();
    ctx.moveTo(points[a].x, points[a].y);
    ctx.lineTo(points[b].x, points[b].y);
    ctx.stroke();
  }
  ctx.font = (12 * k) + "px sans-serif";
  for (const id in points) {
    ctx.fillStyle = "#2563eb";
    ctx.beginPath();
    ctx.arc(points[id].x, points[id].y, 4 * k, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillText(id, points[id].x + 7 * k, points[id].y - 6 * k);
  }
}


// ---------------------------------------------------------------------
// C. Scanner de QR code
// ---------------------------------------------------------------------
const video = document.getElementById("video");
const zoneScan = document.getElementById("zoneScan");
const btnScan = document.getElementById("btnScan");
const canvasScan = document.createElement("canvas");
const ctxScan = canvasScan.getContext("2d", { willReadFrequently: true });

let flux = null;
let scanEnCours = false;

// Le QR contient ".../?arrivee=salleC" : on en extrait "salleC"
function extraireDestination(texte) {
  let id = null;
  try {
    id = new URL(texte).searchParams.get("arrivee");
  } catch (e) {
    id = texte;
  }
  return (id && points[id]) ? id : null;
}

async function demarrerScan() {
  if (scanEnCours) return;
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });
  } catch (e) {
    dire("Caméra indisponible ou refusée. Autorisez-la dans les réglages, ou scannez avec l’appareil photo du téléphone.", "erreur");
    return;
  }
  video.srcObject = flux;
  await video.play();
  zoneScan.style.display = "block";
  btnScan.style.display = "none";
  scanEnCours = true;
  dire("Visez le QR code de votre destination.", "info");
  boucleScan();
}

function arreterScan() {
  scanEnCours = false;
  if (flux) flux.getTracks().forEach(t => t.stop());
  flux = null;
  zoneScan.style.display = "none";
  btnScan.style.display = "block";
}

function boucleScan() {
  if (!scanEnCours) return;

  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvasScan.width = video.videoWidth;
    canvasScan.height = video.videoHeight;
    ctxScan.drawImage(video, 0, 0);
    const image = ctxScan.getImageData(0, 0, canvasScan.width, canvasScan.height);
    const resultat = jsQR(image.data, image.width, image.height);

    if (resultat) {
      const id = extraireDestination(resultat.data);
      if (id) {
        destination = id;
        arreterScan();
        afficher();
        return;
      }
      dire("Ce QR code n’est pas reconnu, essayez-en un autre.", "erreur");
    }
  }
  requestAnimationFrame(boucleScan);
}


// ---------------------------------------------------------------------
// D. Tout relier
// ---------------------------------------------------------------------
const choixPosition = document.getElementById("choixPosition");
const choixTest = document.getElementById("choixTest");
const messageEl = document.getElementById("message");
const etape2 = document.getElementById("etape2");
const destinationTexte = document.getElementById("destinationTexte");

function dire(texte, type) {
  messageEl.textContent = texte;
  messageEl.dataset.type = type || "info";
}

// La destination peut venir de l'adresse (scan avec l'appareil photo du téléphone)
let destination = params.get("arrivee");
if (destination && !points[destination]) destination = null;

function afficher() {
  dessinerPlan();
  if (debug) dessinerGrapheDebug();

  const position = choixPosition.value;
  etape2.classList.toggle("inactive", !position);

  // Texte de l'étape 2
  if (destination) {
    destinationTexte.textContent = "Destination : " + points[destination].nom;
    btnScan.textContent = "Changer de destination";
  } else {
    destinationTexte.textContent = "Scannez le QR code de la salle où vous voulez aller.";
    btnScan.textContent = "Scanner le QR code";
  }

  if (!position) {
    dire("Commencez par choisir l’endroit où vous êtes.", "info");
    return;
  }
  dessinerPastille(position, "#e11d48", "Vous êtes ici");

  if (!destination) {
    if (!scanEnCours) dire("Scannez le QR code de votre destination.", "info");
    return;
  }
  if (destination === position) {
    dire("Vous êtes déjà arrivé !", "ok");
    return;
  }

  const chemin = trouverChemin(position, destination);
  if (!chemin) {
    dire("Aucun chemin trouvé entre ces deux endroits.", "erreur");
    return;
  }
  dessinerLigne(chemin);
  dessinerPastille(position, "#e11d48", "Vous êtes ici");
  dessinerPastille(destination, "#16a34a", points[destination].nom);
  dire("Suivez la ligne bleue jusqu’à : " + points[destination].nom, "ok");
}

// Remplir les listes
choixPosition.innerHTML = '<option value="">Choisir…</option>';
choixTest.innerHTML = '<option value="">(aucune)</option>';
for (const id of CONFIG.lieux) {
  if (!points[id]) continue;
  choixPosition.innerHTML += `<option value="${id}">${points[id].nom}</option>`;
  choixTest.innerHTML += `<option value="${id}">${points[id].nom}</option>`;
}
if (destination) choixTest.value = destination;

// Quand on choisit sa position : on affiche, et on ouvre la caméra si besoin
choixPosition.addEventListener("change", () => {
  afficher();
  if (choixPosition.value && !destination && !scanEnCours) demarrerScan();
});

// Bouton "Scanner" / "Changer de destination"
btnScan.addEventListener("click", () => {
  if (!choixPosition.value) {
    dire("Choisissez d’abord où vous êtes.", "erreur");
    return;
  }
  destination = null;
  choixTest.value = "";
  afficher();
  demarrerScan();
});

document.getElementById("btnAnnulerScan").addEventListener("click", () => {
  arreterScan();
  afficher();
});

choixTest.addEventListener("change", () => {
  arreterScan();
  destination = choixTest.value || null;
  afficher();
});

// Mode debug : un clic sur le plan affiche ses coordonnées
canvas.addEventListener("click", e => {
  if (!debug) return;
  const r = canvas.getBoundingClientRect();
  const x = Math.round((e.clientX - r.left) * canvas.width / r.width);
  const y = Math.round((e.clientY - r.top) * canvas.height / r.height);
  dire("Coordonnées : x: " + x + ", y: " + y, "info");
});

// Chargement du plan (image ou exemple), puis premier affichage
function demarrer() {
  if (!CONFIG.image) {
    canvas.width = 600;
    canvas.height = 400;
    afficher();
    return;
  }
  imagePlan.onload = () => {
    canvas.width = imagePlan.naturalWidth;
    canvas.height = imagePlan.naturalHeight;
    afficher();
  };
  imagePlan.onerror = () => {
    dire("Image du plan introuvable : " + CONFIG.image, "erreur");
  };
  imagePlan.src = CONFIG.image;
}
demarrer();
</script>
</body>
</html>
