<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation dans le bâtiment</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
  canvas#plan { width: 100%; max-width: 600px; border: 1px solid #aaa; display: block; margin-top: 10px; }
  select, button { padding: 8px 12px; font-size: 1rem; }
  #zoneScan { display: none; max-width: 600px; margin-top: 10px; }
  #video { width: 100%; border-radius: 8px; background: #000; }
  .test { margin-top: 16px; padding: 8px; background: #f0f0f0; max-width: 600px; font-size: 0.9rem; }
</style>
</head>
<body>

<h1>Navigation</h1>

<!-- ÉTAPE 1 : choisir où on est -->
<label>1. Où êtes-vous ?
  <select id="choixPosition"></select>
</label>

<p id="message"></p>

<!-- ÉTAPE 2 : la caméra pour scanner la destination (cachée au départ) -->
<div id="zoneScan">
  <video id="video" playsinline muted></video>
  <button id="btnAnnulerScan">Annuler</button>
</div>

<button id="btnChangerDestination" style="display:none; margin-top:8px;">Changer de destination</button>

<canvas id="plan" width="600" height="400"></canvas>

<!-- Pour tester sur ordinateur, sans QR code -->
<div class="test">
  Test (remplace le scan) :
  <select id="choixTest"></select>
</div>

<!-- La bibliothèque qui sait lire un QR code dans une image -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>

<script>
// =====================================================
// A. LES DONNÉES
// =====================================================
const points = {
  entree:    { nom: "Entrée",      x: 313, y: 380 },
  couloir:   { nom: "Couloir",     x: 307, y: 212 },
  couloirAD: { nom: "Couloir A-D", x: 155, y: 188 },
  couloirCE: { nom: "Couloir C-E", x: 453, y: 209 },
  salleA:    { nom: "Salle A",     x: 124, y: 144 },
  salleB:    { nom: "Salle B",     x: 322, y: 133 },
  salleC:    { nom: "Salle C",     x: 499, y: 132 },
  salleD:    { nom: "Salle D",     x: 120, y: 250 },
  salleE:    { nom: "Salle E",     x: 490, y: 250 }
};

const liens = [
  ["entree", "couloir"],
  ["couloir", "couloirAD"],
  ["couloir", "couloirCE"],
  ["couloir", "salleB"],
  ["couloirAD", "salleA"],
  ["couloirAD", "salleD"],
  ["couloirCE", "salleC"],
  ["couloirCE", "salleE"]
];

const lieux = ["entree", "salleA", "salleB", "salleC", "salleD", "salleE"];


// =====================================================
// B. TROUVER LE CHEMIN (inchangé)
// =====================================================
const voisins = {};
for (const id in points) voisins[id] = [];
for (const [a, b] of liens) {
  voisins[a].push(b);
  voisins[b].push(a);
}

function trouverChemin(depart, arrivee) {
  const venantDe = {};
  venantDe[depart] = null;
  const file = [depart];

  while (file.length > 0) {
    const courant = file.shift();
    if (courant === arrivee) break;
    for (const v of voisins[courant]) {
      if (!(v in venantDe)) {
        venantDe[v] = courant;
        file.push(v);
      }
    }
  }

  if (!(arrivee in venantDe)) return null;

  const chemin = [];
  let id = arrivee;
  while (id !== null) {
    chemin.unshift(id);
    id = venantDe[id];
  }
  return chemin;
}


// =====================================================
// C. DESSINER (inchangé)
// =====================================================
const canvas = document.getElementById("plan");
const ctx = canvas.getContext("2d");

function dessinerPlan() {
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, 600, 400);
  ctx.strokeStyle = "#333";
  ctx.lineWidth = 3;
  ctx.strokeRect(20, 20, 560, 360);
  ctx.strokeRect(20, 20, 200, 140);
  ctx.strokeRect(220, 20, 180, 140);
  ctx.strokeRect(400, 20, 180, 140);
  ctx.strokeRect(20, 240, 200, 140);
  ctx.strokeRect(400, 240, 180, 140);
  ctx.fillStyle = "#999";
  ctx.font = "16px sans-serif";
  ctx.fillText("Salle A", 90, 95);
  ctx.fillText("Salle B", 280, 95);
  ctx.fillText("Salle C", 470, 95);
  ctx.fillText("Salle D", 90, 315);
  ctx.fillText("Salle E", 470, 315);
}

function dessinerLigne(chemin) {
  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(points[chemin[0]].x, points[chemin[0]].y);
  for (let i = 1; i < chemin.length; i++) {
    ctx.lineTo(points[chemin[i]].x, points[chemin[i]].y);
  }
  ctx.stroke();
}

function dessinerPastille(id, couleur, texte) {
  const p = points[id];
  ctx.fillStyle = couleur;
  ctx.beginPath();
  ctx.arc(p.x, p.y, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.font = "bold 14px sans-serif";
  ctx.fillText(texte, p.x + 14, p.y - 12);
}


// =====================================================
// D. LE SCANNER DE QR CODE (nouveau)
// =====================================================
const video = document.getElementById("video");
const zoneScan = document.getElementById("zoneScan");
const canvasScan = document.createElement("canvas");   // canvas invisible pour analyser les images
const ctxScan = canvasScan.getContext("2d", { willReadFrequently: true });

let flux = null;          // le flux de la caméra
let scanEnCours = false;  // est-ce qu'on est en train de scanner ?
let messageScan = "";     // message d'erreur éventuel pendant le scan

// Un QR code contient une adresse comme ".../?arrivee=salleC".
// Cette fonction en extrait "salleC" (ou renvoie null si ce n'est pas un de nos QR codes).
function extraireDestination(texte) {
  let id = null;
  try {
    id = new URL(texte).searchParams.get("arrivee");   // cas : adresse complète
  } catch (e) {
    id = texte;                                        // cas : juste "salleC" écrit dans le QR
  }
  return (id && points[id]) ? id : null;
}

// Allumer la caméra et commencer à lire des images
async function demarrerScan() {
  messageScan = "";
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }             // caméra arrière
    });
  } catch (e) {
    message.textContent = "Caméra indisponible ou refusée. Autorisez-la, ou scannez avec l'appareil photo du téléphone.";
    return;
  }
  video.srcObject = flux;
  await video.play();
  zoneScan.style.display = "block";
  scanEnCours = true;
  message.textContent = "Scannez maintenant le QR code de votre destination.";
  boucleScan();
}

// Couper la caméra
function arreterScan() {
  scanEnCours = false;
  if (flux) flux.getTracks().forEach(t => t.stop());
  flux = null;
  zoneScan.style.display = "none";
}

// Cette fonction se répète tant qu'on scanne : à chaque tour,
// on prend une image de la vidéo et on cherche un QR code dedans.
function boucleScan() {
  if (!scanEnCours) return;

  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvasScan.width = video.videoWidth;
    canvasScan.height = video.videoHeight;
    ctxScan.drawImage(video, 0, 0);
    const image = ctxScan.getImageData(0, 0, canvasScan.width, canvasScan.height);
    const resultat = jsQR(image.data, image.width, image.height);

    if (resultat) {
      const id = extraireDestination(resultat.data);
      if (id) {
        destination = id;     // on a la destination !
        arreterScan();
        afficher();
        return;
      } else {
        message.textContent = "Ce QR code n'est pas reconnu, essayez-en un autre.";
      }
    }
  }
  requestAnimationFrame(boucleScan);   // on recommence au prochain affichage
}


// =====================================================
// E. RELIER TOUT
// =====================================================
const choixPosition = document.getElementById("choixPosition");
const choixTest = document.getElementById("choixTest");
const message = document.getElementById("message");
const btnChanger = document.getElementById("btnChangerDestination");

// La destination peut déjà venir de l'adresse (si on a scanné avec l'appareil photo du téléphone)
let destination = new URLSearchParams(window.location.search).get("arrivee");
if (destination && !points[destination]) destination = null;

function afficher() {
  dessinerPlan();
  btnChanger.style.display = "none";
  const position = choixPosition.value;

  if (!position) {
    message.textContent = "Choisissez d'abord où vous êtes.";
    return;
  }
  dessinerPastille(position, "#e11d48", "Vous êtes ici");

  if (!destination) {
    if (!scanEnCours) message.textContent = "Scannez le QR code de votre destination.";
    return;
  }
  if (destination === position) {
    message.textContent = "Vous y êtes déjà !";
    btnChanger.style.display = "inline-block";
    return;
  }

  const chemin = trouverChemin(position, destination);
  if (!chemin) {
    message.textContent = "Aucun chemin trouvé.";
    return;
  }
  dessinerLigne(chemin);
  dessinerPastille(position, "#e11d48", "Vous êtes ici");
  dessinerPastille(destination, "#16a34a", points[destination].nom);
  message.textContent = "Chemin : " + chemin.map(id => points[id].nom).join(" → ");
  btnChanger.style.display = "inline-block";
}

// Remplir les listes
choixPosition.innerHTML = '<option value="">(choisir)</option>';
choixTest.innerHTML = '<option value="">(aucun)</option>';
for (const id of lieux) {
  choixPosition.innerHTML += `<option value="${id}">${points[id].nom}</option>`;
  choixTest.innerHTML += `<option value="${id}">${points[id].nom}</option>`;
}
if (destination) choixTest.value = destination;

// *** LE LISTENER DEMANDÉ ***
// Dès que la personne choisit sa position, on affiche le plan,
// et si on ne connaît pas encore la destination, on ouvre la caméra.
choixPosition.addEventListener("change", () => {
  afficher();
  if (choixPosition.value && !destination && !scanEnCours) {
    demarrerScan();
  }
});

// Bouton "Changer de destination" : on oublie l'ancienne et on rescanne
btnChanger.addEventListener("click", () => {
  destination = null;
  choixTest.value = "";
  afficher();
  demarrerScan();
});

// Bouton "Annuler" pendant le scan
document.getElementById("btnAnnulerScan").addEventListener("click", () => {
  arreterScan();
  afficher();
});

// Liste de test (ordinateur)
choixTest.addEventListener("change", () => {
  arreterScan();
  destination = choixTest.value || null;
  afficher();
});

afficher();
</script>
</body>
</html>
