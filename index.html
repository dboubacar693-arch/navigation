<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boussole Cadran Rotatif</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #000000;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Conteneur principal */
    #conteneur-boussole {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* LA FLÈCHE FIXE : pointe toujours vers le haut du téléphone */
    #fleche-fixe {
      position: absolute;
      top: -15px; /* Dépasse légèrement en haut du cercle */
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 24px solid #ff3b30; /* Triangle rouge fixe */
      z-index: 10; /* Toujours au-dessus du cadran */
    }

    /* Trait central fixe (optionnel, comme sur iPhone) */
    #croix-centrale {
      position: absolute;
      width: 2px;
      height: 60px;
      background-color: rgba(255, 255, 255, 0.3);
      z-index: 5;
    }

    /* LE CADRAN ROTATIF : contient N, S, E, O */
    #cadran {
      width: 260px;
      height: 260px;
      border: 3px solid #333;
      border-radius: 50%;
      position: relative;
      transition: transform 0.1s ease-out;
    }

    /* Style des lettres cardinales */
    .point {
      position: absolute;
      font-size: 24px;
      font-weight: bold;
    }

    .nord { top: 10px; left: 50%; transform: translateX(-50%); color: #ff3b30; }
    .sud  { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .est  { right: 15px; top: 50%; transform: translateY(-50%); }
    .ouest{ left: 15px; top: 50%; transform: translateY(-50%); }

    #cap-texte {
      margin-top: 30px;
      font-size: 28px;
      font-weight: 300;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background-color: #007aff;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="conteneur-boussole">
    <!-- Élément fixe qui montre l'avant du téléphone -->
    <div id="fleche-fixe"></div>
    <div id="croix-centrale"></div>

    <!-- Disque entier qui va tourner -->
    <div id="cadran">
      <div class="point nord">N</div>
      <div class="point est">E</div>
      <div class="point sud">S</div>
      <div class="point ouest">O</div>
    </div>
  </div>

  <div id="cap-texte">0° N</div>
  <button id="btn-start">Activer la boussole</button>

  <script>
    const cadran = document.getElementById('cadran');
    const capTexte = document.getElementById('cap-texte');
    const bouton = document.getElementById('btn-start');

    function obtenirDirection(degres) {
      const directions = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
      const index = Math.round(degres / 45) % 8;
      return directions[index];
    }

    function gererOrientation(event) {
      let cap = null;

      // iOS
      if (event.webkitCompassHeading) {
        cap = event.webkitCompassHeading;
      } 
      // Android
      else if (event.alpha !== null) {
        cap = 360 - event.alpha;
      }

      if (cap !== null) {
        const angle = Math.round(cap);
        
        // C'est le cadran entier qui tourne à l'inverse du téléphone
        cadran.style.transform = `rotate(${-angle}deg)`;
        
        // Affichage du cap suivi par la flèche fixe
        capTexte.innerText = `${angle}° ${obtenirDirection(angle)}`;
      }
    }

    bouton.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(state => {
            if (state === 'granted') {
              window.addEventListener('deviceorientation', gererOrientation);
              bouton.style.display = 'none';
            }
          })
          .catch(console.error);
      } else {
        window.addEventListener('deviceorientationabsolute', gererOrientation);
        window.addEventListener('deviceorientation', gererOrientation);
        bouton.style.display = 'none';
      }
    });
  </script>

</body>
</html>
