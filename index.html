<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace : départ GPS, mouvement par capteurs</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 640px; }
  h1 { font-size: 1.3rem; margin: 0 0 12px; }
  .boutons { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  button { min-height: 46px; padding: 8px 14px; font-size: 1rem; border: 1px solid #888; border-radius: 8px; background: #fff; }
  #btnScan { width: 100%; background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 600; margin-bottom: 12px; }
  #message { padding: 10px 12px; border-left: 6px solid #2563eb; background: #eef2ff; border-radius: 8px; margin-bottom: 12px; }
  #zoneScan { display: none; margin-bottom: 12px; }
  #video { width: 100%; border-radius: 10px; background: #000; display: block; margin-bottom: 8px; }
  canvas#dessin { width: 100%; height: auto; border: 1px solid #aaa; display: block; }
  #infos { margin: 10px 0; font-size: 0.95rem; line-height: 1.5; }
  details { margin-top: 16px; padding: 10px; background: #f0f0f0; border-radius: 8px; font-size: 0.9rem; }
  details .boutons { margin-top: 10px; }
</style>
</head>
<body>

<h1>Dessiner un trait avec deux QR codes</h1>

<div id="message">Scannez le QR code « début », puis marchez en tenant le téléphone à plat, le haut du téléphone vers l’avant.</div>

<button id="btnScan">📷 Scanner un QR code</button>

<div id="zoneScan">
  <video id="video" playsinline muted></video>
  <button id="btnAnnulerScan">Annuler</button>
</div>

<div class="boutons">
  <button id="effacerDernier">Effacer le dernier trait</button>
  <button id="toutEffacer">Tout effacer</button>
</div>

<canvas id="dessin" width="600" height="600"></canvas>
<div id="infos"></div>

<!-- Pour tester sans QR code et sans marcher -->
<details>
  <summary>Mode test</summary>
  <div class="boutons">
    <button id="demarrer">▶ Démarrer un trait</button>
    <button id="arreter">■ Arrêter le trait</button>
  </div>
  <div class="boutons">
    <button id="gauche">⟲ Tourner de 30°</button>
    <button id="droite">⟳ Tourner de 30°</button>
    <button id="pasTest">Faire un pas</button>
  </div>
</details>

<script>
// =====================================================
// A. LES RÉGLAGES (à modifier pour ajuster)
// =====================================================
const ZONE = 20;              // largeur affichée, en mètres
const LONGUEUR_PAS = 0.7;     // longueur d'un pas, en mètres
const SEUIL_PAS = 1.5;        // sensibilité des pas (plus petit = plus sensible)
const DELAI_PAS = 350;        // temps minimum entre deux pas (millisecondes)
const PRECISION_GPS_MAX = 30; // on ignore un point de départ GPS plus imprécis que ça (mètres)
const COULEURS = ["#2563eb", "#e11d48", "#16a34a", "#f59e0b", "#7c3aed", "#0891b2"];


// =====================================================
// B. LA MÉMOIRE DU PROGRAMME
// =====================================================
const traits = [];                  // les traits terminés
let traitEnCours = null;            // le trait qu'on dessine (null si aucun)
let position = { x: 0, y: 0 };      // position actuelle, en mètres
let nbPas = 0;

// Direction du HAUT du téléphone (0 = nord, 90 = est)
let cap = 0;
let decalageIphone = null;          // correction de la boussole sur iPhone
let telephoneRedresse = false;      // vrai si le téléphone est trop vertical

// Détection des pas
let moyenne = 9.8;                  // moyenne de l'accélération (≈ gravité)
let dernierPas = 0;                 // heure du dernier pas
let auDessus = false;               // l'écart est-il au-dessus du seuil ?
let capteursActifs = false;
let capRecu = false;                // a-t-on reçu des données de boussole ?

// Départ GPS
let refGps = null;                  // premier point GPS : l'origine de tout le plan
let departPrecedent = { x: 0, y: 0 }; // où a commencé le dernier trait (en mètres)
let etatGps = "";                   // texte affiché sur l'état du GPS


// =====================================================
// C. DESSINER
// =====================================================
const canvas = document.getElementById("dessin");
const ctx = canvas.getContext("2d");

// Mètres → pixels. L'origine (premier départ GPS) est au centre du canvas.
function versEcran(p) {
  const echelle = canvas.width / ZONE;   // pixels pour 1 mètre
  return {
    x: canvas.width / 2 + p.x * echelle,
    y: canvas.height / 2 + p.y * echelle
  };
}

function dessiner() {
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // l'origine du plan (gris)
  const o = versEcran({ x: 0, y: 0 });
  ctx.fillStyle = "#999";
  ctx.beginPath();
  ctx.arc(o.x, o.y, 6, 0, Math.PI * 2);
  ctx.fill();

  // les traits, chacun dans sa couleur
  const tous = traitEnCours ? traits.concat([traitEnCours]) : traits;
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  tous.forEach((trait, i) => {
    ctx.strokeStyle = COULEURS[i % COULEURS.length];
    ctx.beginPath();
    trait.forEach((p, k) => {
      const a = versEcran(p);
      if (k === 0) ctx.moveTo(a.x, a.y);
      else ctx.lineTo(a.x, a.y);
    });
    ctx.stroke();
  });

  // la position actuelle (rond noir) et la direction du haut du téléphone (flèche)
  if (traitEnCours) {
    const a = versEcran(position);
    const rad = cap * Math.PI / 180;
    const bout = { x: a.x + Math.sin(rad) * 34, y: a.y - Math.cos(rad) * 34 };
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(a.x, a.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(bout.x, bout.y);
    ctx.stroke();
    // pointe de la flèche
    ctx.beginPath();
    ctx.arc(bout.x, bout.y, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  majInfos();
}


// =====================================================
// D. MESSAGES ET INFOS
// =====================================================
const messageEl = document.getElementById("message");
const infos = document.getElementById("infos");

function dire(texte) { messageEl.textContent = texte; }

function majInfos() {
  let texte = "";
  if (traitEnCours) {
    texte += "🔴 Trait en cours · Cap : " + Math.round(cap) + "° · Pas : " + nbPas +
             " · Distance : " + (nbPas * LONGUEUR_PAS).toFixed(1) + " m<br>";
    if (telephoneRedresse) {
      texte += "⚠️ Téléphone trop vertical : posez-le plus à plat pour que la direction soit juste.<br>";
    }
  }
  if (etatGps) texte += "Départ GPS : " + etatGps + "<br>";
  texte += "Traits conservés : " + traits.length;
  infos.innerHTML = texte;
}


// =====================================================
// E. LE GPS : SEULEMENT POUR LE POINT DE DÉPART
// =====================================================

// GPS (degrés) → mètres, par rapport à un point de référence
function enMetres(p, ref) {
  const M = 111320;
  return {
    x: (p.lng - ref.lng) * M * Math.cos(ref.lat * Math.PI / 180),
    y: (ref.lat - p.lat) * M
  };
}

// Demande UNE position GPS (pas un suivi continu). Appelle rappel(fix) ou rappel(null).
function demanderGps(rappel) {
  if (!navigator.geolocation) { rappel(null); return; }
  navigator.geolocation.getCurrentPosition(
    pos => rappel({
      lat: pos.coords.latitude,
      lng: pos.coords.longitude,
      precision: pos.coords.accuracy
    }),
    err => rappel(null),
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
  );
}

// Quand le GPS répond : on place le départ du trait à la bonne position
function appliquerDepartGps(fix) {
  if (!fix) {
    etatGps = "non obtenu (normal à l’intérieur) : départ placé au même endroit que le précédent";
    majInfos();
    return;
  }
  if (fix.precision > PRECISION_GPS_MAX) {
    etatGps = "trop imprécis (± " + Math.round(fix.precision) + " m), ignoré";
    majInfos();
    return;
  }

  if (!refGps) refGps = fix;                      // le tout premier fix = l'origine du plan
  const nouveau = enMetres(fix, refGps);          // où commence ce trait, par rapport à l'origine

  // On déplace le trait déjà commencé (provisoire) vers sa vraie position de départ
  const dx = nouveau.x - departPrecedent.x;
  const dy = nouveau.y - departPrecedent.y;
  traitEnCours.forEach(p => { p.x += dx; p.y += dy; });
  position.x += dx;
  position.y += dy;
  departPrecedent = { x: nouveau.x, y: nouveau.y };

  etatGps = "ok (± " + Math.round(fix.precision) + " m)";
  dessiner();
}


// =====================================================
// F. LES CAPTEURS : PAS (accéléromètre) ET DIRECTION (boussole)
// =====================================================

// Faire un pas : on avance de LONGUEUR_PAS mètres dans la direction du haut du téléphone
function faireUnPas() {
  if (!traitEnCours) return;
  const rad = cap * Math.PI / 180;
  position = {
    x: position.x + Math.sin(rad) * LONGUEUR_PAS,
    y: position.y - Math.cos(rad) * LONGUEUR_PAS   // vers le haut de l'écran = nord
  };
  traitEnCours.push({ x: position.x, y: position.y });
  nbPas++;
  dessiner();
}

// Détecter les pas avec l'accéléromètre
function surMouvement(e) {
  if (!traitEnCours || scanEnCours) return;   // pas de comptage pendant le scan
  const a = e.accelerationIncludingGravity;
  if (!a || a.x === null) return;

  // force totale ressentie : ~9.8 au repos, qui oscille quand on marche
  const force = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z);
  moyenne = moyenne * 0.98 + force * 0.02;      // moyenne qui suit lentement
  const ecart = force - moyenne;                // l'oscillation due à la marche

  // un pas = l'écart passe au-dessus du seuil, pas trop vite après le précédent
  const maintenant = Date.now();
  if (ecart > SEUIL_PAS && !auDessus && maintenant - dernierPas > DELAI_PAS) {
    dernierPas = maintenant;
    faireUnPas();
  }
  auDessus = ecart > SEUIL_PAS;
}

function normaliser(angle) {
  return ((angle % 360) + 360) % 360;
}

// Calculer la direction du HAUT du téléphone
function surOrientation(e) {
  if (e.alpha === null || e.beta === null) return;
  capRecu = true;

  // Si le téléphone est presque vertical, son "haut" pointe vers le ciel :
  // la direction n'a plus de sens. On garde alors l'ancienne valeur.
  telephoneRedresse = Math.abs(e.beta) > 70;
  if (telephoneRedresse) {
    if (traitEnCours) majInfos();
    return;
  }

  // alpha = rotation du téléphone à plat. Direction du haut = 360 - alpha.
  let capHaut = normaliser(360 - e.alpha);

  // iPhone : alpha n'est pas calé sur le nord. On le recale avec la boussole
  // quand le téléphone est bien à plat.
  if (typeof e.webkitCompassHeading === "number") {
    if (Math.abs(e.beta) < 30 && Math.abs(e.gamma) < 30) {
      decalageIphone = e.webkitCompassHeading - capHaut;
    }
    capHaut = (decalageIphone === null) ? e.webkitCompassHeading
                                        : normaliser(capHaut + decalageIphone);
  }

  cap = capHaut;
  if (traitEnCours) dessiner();
}

// Activer les capteurs. Sur iPhone, ça doit se faire juste après un clic.
async function activerCapteurs() {
  if (capteursActifs) return true;
  try {
    const demandesPermission = [];
    if (typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {
      demandesPermission.push(DeviceMotionEvent.requestPermission());
    }
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function") {
      demandesPermission.push(DeviceOrientationEvent.requestPermission());
    }
    const reponses = await Promise.all(demandesPermission);
    if (reponses.some(r => r !== "granted")) return false;
  } catch (e) {
    return false;
  }
  window.addEventListener("devicemotion", surMouvement);
  if ("ondeviceorientationabsolute" in window) {
    window.addEventListener("deviceorientationabsolute", surOrientation);
  } else {
    window.addEventListener("deviceorientation", surOrientation);
  }
  capteursActifs = true;
  return true;
}


// =====================================================
// G. DÉMARRER / ARRÊTER UN TRAIT
// =====================================================

// Ce que fait le QR code « début »
function demarrerTrait() {
  if (traitEnCours) {
    dire("Un trait est déjà en cours. Scannez le QR code « fin » pour l’arrêter.");
    return;
  }
  // Le trait commence tout de suite, à une position provisoire.
  // Quand le GPS répond (quelques secondes), on le déplace au bon endroit.
  position = { x: departPrecedent.x, y: departPrecedent.y };
  nbPas = 0;
  traitEnCours = [{ x: position.x, y: position.y }];
  etatGps = "recherche en cours…";

  if (!capteursActifs) {
    dire("Trait démarré, mais les capteurs ne sont pas activés. Autorisez-les, ou utilisez le mode test.");
  } else {
    dire("Trait en cours… Marchez, téléphone à plat, haut du téléphone vers l’avant, puis scannez « fin ».");
    setTimeout(() => {
      if (traitEnCours && !capRecu) {
        dire("Aucune donnée de boussole reçue. Autorisez les capteurs de mouvement pour ce site.");
      }
    }, 3000);
  }

  const monTrait = traitEnCours;
  demanderGps(fix => {
    if (traitEnCours !== monTrait) return;   // le trait a été arrêté entre-temps
    appliquerDepartGps(fix);
  });
  dessiner();
}

// Ce que fait le QR code « fin »
function arreterTrait() {
  if (!traitEnCours) {
    dire("Aucun trait en cours. Scannez d’abord le QR code « début ».");
    return;
  }
  traits.push(traitEnCours);
  dire("Trait terminé (" + nbPas + " pas, environ " + (nbPas * LONGUEUR_PAS).toFixed(1) +
       " m). Scannez « début » pour en faire un autre.");
  traitEnCours = null;
  dessiner();
}


// =====================================================
// H. LE SCANNER DE QR CODE
// =====================================================
const video = document.getElementById("video");
const zoneScan = document.getElementById("zoneScan");
const btnScan = document.getElementById("btnScan");
const canvasScan = document.createElement("canvas");   // canvas invisible pour analyser les images
const ctxScan = canvasScan.getContext("2d", { willReadFrequently: true });

let flux = null;
let scanEnCours = false;

// Le QR code contient une adresse comme ...?action=debut ou ...?action=fin
function lireAction(texte) {
  let valeur = texte.trim().toLowerCase();
  try {
    const a = new URL(texte).searchParams.get("action");
    if (a) valeur = a.trim().toLowerCase();
  } catch (e) { /* ce n'est pas une adresse, on garde le texte */ }

  if (valeur === "debut" || valeur === "début") return "debut";
  if (valeur === "fin") return "fin";
  if (/action=d[eé]but/.test(valeur)) return "debut";
  if (/action=fin/.test(valeur)) return "fin";
  return null;
}

// Charger jsQR : d'abord un fichier local (jsQR.js), puis deux sites de secours
const SOURCES_JSQR = [
  "jsQR.js",
  "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js",
  "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"
];

function chargerScript(url) {
  return new Promise(resolve => {
    const s = document.createElement("script");
    s.src = url;
    s.onload = () => resolve(typeof jsQR !== "undefined");
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
}

async function chargerJsQR() {
  if (typeof jsQR !== "undefined") return true;
  for (const url of SOURCES_JSQR) {
    if (await chargerScript(url)) return true;
  }
  return false;
}

// Détecteur de QR codes intégré au navigateur, s'il existe (rapide et précis)
let detecteurNatif = null;
if ("BarcodeDetector" in window) {
  try { detecteurNatif = new BarcodeDetector({ formats: ["qr_code"] }); }
  catch (e) { detecteurNatif = null; }
}

let nbImages = 0;
let texteScan = "";
let minuteurAide = null;

function expliquerErreurCamera(e) {
  if (!window.isSecureContext) {
    return "La caméra est bloquée car cette page n’est pas ouverte dans un contexte sécurisé. Ouvrez-la avec une adresse HTTPS ou depuis http://localhost (pas directement depuis les fichiers téléchargés).";
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return "Ce navigateur ne donne pas accès à la caméra. Ouvrez la page dans un navigateur récent et vérifiez qu’elle est servie en HTTPS.";
  }
  if (e && e.name === "NotAllowedError") {
    return "L’accès à la caméra a été refusé. Autorisez la caméra pour ce site dans les réglages du navigateur, puis rechargez la page.";
  }
  if (e && e.name === "NotFoundError") {
    return "Aucune caméra n’a été trouvée sur cet appareil.";
  }
  if (e && e.name === "NotReadableError") {
    return "La caméra est déjà utilisée par une autre application ou n’a pas pu démarrer. Fermez les autres applications qui l’utilisent, puis réessayez.";
  }
  if (e && e.name === "OverconstrainedError") {
    return "La caméra ne prend pas en charge les réglages demandés. Réessayez avec une autre caméra.";
  }
  return "Impossible de démarrer la caméra" + (e && e.name ? " (" + e.name + ")" : "") + ". Vérifiez ses autorisations et réessayez.";
}

async function demarrerScan() {
  if (scanEnCours) return;
  if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    dire(expliquerErreurCamera());
    return;
  }
  dire("Demande d’accès à la caméra…");
  try {
    flux = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });
    video.srcObject = flux;
    await video.play();
  } catch (e) {
    if (flux) flux.getTracks().forEach(t => t.stop());
    flux = null;
    video.srcObject = null;
    dire(expliquerErreurCamera(e));
    return;
  }

  dire("Préparation du lecteur de QR code…");
  const jsqrOk = await chargerJsQR();
  if (!jsqrOk && !detecteurNatif) {
    if (flux) flux.getTracks().forEach(t => t.stop());
    flux = null;
    video.srcObject = null;
    dire("La caméra fonctionne, mais le lecteur QR n’a pas pu être chargé. Vérifiez votre connexion Internet ou placez jsQR.js à côté de cette page.");
    return;
  }
  zoneScan.style.display = "block";
  btnScan.style.display = "none";
  scanEnCours = true;
  nbImages = 0;
  texteScan = "Recherche d’un QR code…";
  dire(texteScan);

  minuteurAide = setTimeout(() => {
    if (scanEnCours) {
      texteScan = "Toujours rien. Approchez le QR code (15 à 25 cm), tenez-le bien droit, bien éclairé, sans reflet.";
      dire(texteScan + " (" + nbImages + " images analysées)");
    }
  }, 8000);

  boucleScan();
}

function arreterScan() {
  scanEnCours = false;
  clearTimeout(minuteurAide);
  if (flux) flux.getTracks().forEach(t => t.stop());
  flux = null;
  zoneScan.style.display = "none";
  btnScan.style.display = "block";
}

// Analyse l'image actuelle de la vidéo : renvoie le texte du QR code, ou null
async function lireImage() {
  if (detecteurNatif) {
    try {
      const r = await detecteurNatif.detect(video);
      if (r.length > 0) return r[0].rawValue;
    } catch (e) { /* on essaie avec jsQR */ }
  }
  if (typeof jsQR !== "undefined") {
    canvasScan.width = video.videoWidth;
    canvasScan.height = video.videoHeight;
    ctxScan.drawImage(video, 0, 0);
    const image = ctxScan.getImageData(0, 0, canvasScan.width, canvasScan.height);
    const resultat = jsQR(image.data, image.width, image.height, { inversionAttempts: "attemptBoth" });
    if (resultat) return resultat.data;
  }
  return null;
}

// Se répète tant qu'on scanne
async function boucleScan() {
  if (!scanEnCours) return;

  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    const texte = await lireImage();
    if (!scanEnCours) return;
    nbImages++;

    if (texte) {
      const action = lireAction(texte);
      if (action) {
        arreterScan();                           // on éteint la caméra
        if (action === "debut") demarrerTrait(); // QR n°1
        if (action === "fin") arreterTrait();    // QR n°2
        return;
      }
      texteScan = "QR code lu mais non reconnu. Contenu : « " + texte + " »";
      dire(texteScan);
    } else if (nbImages % 10 === 0) {
      dire(texteScan + " (" + nbImages + " images analysées)");
    }
  }
  requestAnimationFrame(boucleScan);
}

// Le clic sur "Scanner" : on active les capteurs (obligatoire juste après un clic sur iPhone),
// on lance une première demande de GPS (pour obtenir l'autorisation à l'avance), puis la caméra.
btnScan.addEventListener("click", async () => {
  await activerCapteurs();
  if (!refGps) demanderGps(() => {});
  demarrerScan();
});

document.getElementById("btnAnnulerScan").addEventListener("click", () => {
  arreterScan();
  dire("Scan annulé.");
});


// =====================================================
// I. EFFACER
// =====================================================
// Si plus aucun trait n'existe, on oublie aussi l'origine du plan
function reinitialiserSiVide() {
  if (traits.length === 0 && !traitEnCours) {
    refGps = null;
    departPrecedent = { x: 0, y: 0 };
    etatGps = "";
  }
}

document.getElementById("effacerDernier").addEventListener("click", () => {
  traits.pop();
  reinitialiserSiVide();
  dessiner();
});
document.getElementById("toutEffacer").addEventListener("click", () => {
  traits.length = 0;
  reinitialiserSiVide();
  dessiner();
});


// =====================================================
// J. MODE TEST (sans QR code et sans marcher)
// =====================================================
document.getElementById("demarrer").addEventListener("click", demarrerTrait);
document.getElementById("arreter").addEventListener("click", arreterTrait);
document.getElementById("gauche").addEventListener("click", () => {
  cap = normaliser(cap - 30);
  dessiner();
});
document.getElementById("droite").addEventListener("click", () => {
  cap = normaliser(cap + 30);
  dessiner();
});
document.getElementById("pasTest").addEventListener("click", faireUnPas);

dessiner();
</script>
</body>
</html>
